name: Run Checks
on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      node-version:
        description: "Node.js version to test against"
        type: string
        default: "22"

jobs:
  test:
    name: Run Unit Tests (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
